<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mouse Pointer Resource Library</title>
  <meta name="description" content="Static cursor resource library hosted by GitHub Pages.">
  <link rel="icon" type="image/png" href="../images/app-icon.png">
  <link rel="stylesheet" href="./resources.css">
</head>
<body>
  <header class="library-header">
    <a class="brand" href="../">
      <img src="../images/app-icon.png" alt="Mouse Pointer Manager icon">
      <span>Mouse Pointer Resource Library</span>
    </a>
    <nav>
      <a href="../">Home</a>
      <a href="https://github.com/yuanyue1234/MousePointer/releases" target="_blank" rel="noreferrer">Releases</a>
      <a href="https://github.com/yuanyue1234/MousePointer" target="_blank" rel="noreferrer">GitHub</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">GitHub Pages</p>
      <h1>Cursor Resource Library</h1>
      <p>Downloadable cursor packs will be indexed here. Resource files should live in GitHub Releases; this page only presents the catalog.</p>
    </section>

    <section class="status-panel" id="statusPanel">
      Loading resource catalog...
    </section>

    <section class="resource-grid" id="resourceGrid" aria-live="polite"></section>
  </main>

  <script src="./resources.js"></script>
</body>
</html>
