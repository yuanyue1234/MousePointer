name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build portable packages
        shell: pwsh
        run: |
          .\scripts\build_portable.ps1 -PackageMode OneFile

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: python
        run: |
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          owner, repo = os.environ["GITHUB_REPOSITORY"].split("/", 1)
          token = os.environ["GITHUB_TOKEN"]
          tag = os.environ["TAG_NAME"]
          api = f"https://api.github.com/repos/{owner}/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "MousePointerRelease",
          }

          def request(method, url, payload=None, content_type="application/json"):
              data = None
              local_headers = dict(headers)
              if payload is not None:
                  if isinstance(payload, (bytes, bytearray)):
                      data = payload
                  else:
                      data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
                  local_headers["Content-Type"] = content_type
              req = urllib.request.Request(url, data=data, headers=local_headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=180) as response:
                      body = response.read()
                      return response.status, json.loads(body.decode("utf-8")) if body else None
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"{method} {url} failed: HTTP {exc.code}\n{detail}") from exc

          def optional_request(method, url):
              req = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=180) as response:
                      body = response.read()
                      return response.status, json.loads(body.decode("utf-8")) if body else None
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return 404, None
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"{method} {url} failed: HTTP {exc.code}\n{detail}") from exc

          status, old_release = optional_request("GET", f"{api}/releases/tags/{urllib.parse.quote(tag, safe='')}")
          if status == 200 and old_release:
              request("DELETE", f"{api}/releases/{old_release['id']}")

          release_body = (
              "Mouse Pointer Manager 2.1 portable release.\n\n"
              "- MousePointer_Portable.exe: single-file portable executable with bundled installer runtime.\n"
              "- SHA256SUMS.txt: package hashes."
          )
          _, release = request("POST", f"{api}/releases", {
              "tag_name": tag,
              "name": f"MousePointer {tag}",
              "body": release_body,
              "draft": False,
              "prerelease": False,
              "make_latest": "true",
          })

          upload_base = release["upload_url"].split("{", 1)[0]
          release_dir = Path("release-assets")
          portable_candidates = sorted(release_dir.glob("*.exe"))
          if len(portable_candidates) != 1:
              raise RuntimeError(f"Expected exactly one portable exe, found {len(portable_candidates)}: {portable_candidates}")
          assets = [
              (portable_candidates[0], "MousePointer_Portable.exe"),
              (release_dir / "SHA256SUMS.txt", "SHA256SUMS.txt"),
          ]
          for asset, release_name in assets:
              if not asset.exists():
                  raise FileNotFoundError(asset)
              upload_url = f"{upload_base}?name={urllib.parse.quote(release_name)}"
              request("POST", upload_url, asset.read_bytes(), "application/octet-stream")
              print(f"uploaded {release_name}")
